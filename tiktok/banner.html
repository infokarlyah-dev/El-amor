<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:radial-gradient(circle at 20% 15%,#25f4ee55,transparent 40%),radial-gradient(circle at 85% 85%,#fe2c5566,transparent 45%),#0b0b10;font-family:'Helvetica Neue',Arial,sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative}
.tag{font-size:44px;letter-spacing:10px;text-transform:uppercase;color:#25f4ee;margin-bottom:40px}
h1{font-size:190px;line-height:.95;font-weight:900;text-shadow:-8px 0 #25f4ee,8px 0 #fe2c55}
h1 span{display:block}
.sub{margin-top:70px;font-size:54px;font-weight:300;max-width:800px;line-height:1.3}
.btn{margin-top:90px;padding:34px 80px;border-radius:70px;background:#fe2c55;font-size:56px;font-weight:700;box-shadow:-8px 0 #25f4ee}
.heart{position:absolute;font-size:120px;opacity:.9}
</style></head><body>
<div class="heart" style="top:140px;right:120px">❤️</div>
<div class="heart" style="bottom:200px;left:100px;font-size:90px">📖</div>
<div class="tag">TikTok · Story</div>
<h1><span>MI</span><span>HISTORY</span></h1>
<div class="sub">Cada historia merece ser contada. Esta es la mía.</div>
<div class="btn">▶ Mira ahora</div>
</body></html>
